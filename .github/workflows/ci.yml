name: J713 filter baseline diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.9'
      - name: Measure qualified baseline without hardware playback
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -I -B tools/ci/diagnose-j713-fir.py --summary "$RUNNER_TEMP/j713-summary.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: j713-filter-baseline-summary
          path: ${{ runner.temp }}/j713-summary.json
          if-no-files-found: error
          retention-days: 7
